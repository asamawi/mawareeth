[workflow]
persistent_facts = [
  "Subagents for implementation, review, investigation and test diagnosis use the `codex` agent (Agent subagent_type `codex`), the owner's standing preference (~/.claude/CLAUDE.md). It overrides any model a step names (`sonnet`, `same model capability as the current session`). Start each codex prompt with a tier line: `Codex tier: standard` for implementation, review fixes and review layers; `Codex tier: deep` for implementing a spec whose `warnings` include `oversized`, for reviewing a diff over 60 kB, and for a retry after a standard attempt failed; `Codex tier: light` for mechanical edits. Say in each prompt whether Codex may edit files: yes for implementation and patches, read-only for reviewers. Codex cannot read `_bmad/render/`, so first copy any file a prompt points at there (review-prompt files, the claims file) into a new folder under the system temp directory, and pass those paths. Codex cannot run npm build or test, so the parent runs the spec's Verification commands. Fall back to a Claude subagent for one launch only when codex fails to start, stalls with no codex process, or reports a usage limit, and record that in the spec.",
]

implementation_handoff = """
Launch the `codex` agent (Agent subagent_type `codex`) with no prior conversation context. Codex may edit files. Use this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""

# Epic 8 retro F19: a response field added in one story (8.9's preview `revision`) broke a strict
# web parser another story owned (`parseChoice`), and every per-story review passed it.
[[workflow.review_layers]]
id = "cross-story-contract"
name = "Cross-Story Contract Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

You review the contract between the server and its consumers. The change under review is the unified diff at `{diff_file}`; read it, then read the repository as it is after the change (the working tree).

1. List every change in the diff to a shape that crosses a boundary: a JSON response or request body built by a Django/DRF view or helper (`api/`, `calc/views.py`, `reports/`, `mawareeth/`), a contract parser or dumper (`engine/contracts/`, `presentation/`, `web/src/contracts/`), or a status/variant value such a body can take. Count added, removed or renamed fields, type or nullability changes, and new status values. If there is none, reply "No contract shape changed" and stop.
2. For each changed shape, find every consumer on the other side in the whole repository, not only in the diff: strict TypeScript parsers (`hasExactKeys`, `exact(`, `parse*` functions under `web/src/api`, `web/src/contracts`, `web/src/interview`), Python contract parsers, shared fixtures (`api/contracts/*.json`, `contracts/fixtures/`), and harnesses that read these bodies (`api/capacity.py`, `mawareeth/release_gates.py`).
3. For each consumer and for every status or variant the body can have (for example a preview's `available`, `unavailable`, `choose_school`, `not_ready`), decide whether the consumer accepts the changed shape, and whether a test or fixture sends exactly that envelope through it. Cite file:line for both.

Report one finding per consumer that would reject, drop or misread the changed shape for any variant, and one per variant whose full envelope no test exercises. Give a concrete failure scenario for each: which response, which consumer, and what the user would see. Do not report style.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
"""
