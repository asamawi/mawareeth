[workflow]

persistent_facts = [
  "Routing (owner's standing preference, ~/.claude/CLAUDE.md, set 2026-11-19 to save Codex usage): implement the spec with a Claude subagent (Agent subagent_type `general-purpose`, model `sonnet`), never with codex. Review layers, investigation and test diagnosis use the `codex` agent (Agent subagent_type `codex`), and so do review-fix patches touching at most 3 files; larger review fixes go to the sonnet subagent. Run all review layers as ONE combined read-only codex call: put every layer's prompt in one prompt, a section per layer id, and ask for findings grouped by layer id; launch layers separately only if the combined call fails. This overrides any model a step names (`sonnet`, `same model capability as the current session`). Start each codex prompt with a tier line: `Codex tier: standard` for review and investigation; `Codex tier: deep` only for reviewing a diff over 60 kB or a retry after a standard attempt failed; `Codex tier: light` for mechanical edits. Say in each codex prompt whether Codex may edit files. Codex cannot read `_bmad/render/`, so first copy any file a prompt points at there (review-prompt files, the claims file) into a new folder under the system temp directory, and pass those paths. Codex cannot run npm build or test, so the parent runs the spec's Verification commands. If codex fails to start, stalls with no codex process, or reports a usage limit, use a sonnet subagent for that launch and record it in the spec.",
  "Unattended run driven by scripts/auto-dev.ps1 on the branch already checked out (`development`, or a fix branch for bug fixes). Never push, merge, rebase, reset or switch branches; commit locally only.",
  "Django tests need Postgres on localhost:5432 (the driver starts it). Run tests serially with `uv run python manage.py test <targeted labels> --noinput`; never use --parallel and never start two test runs at once. Run targeted test modules for the story, not the full calc+api suite (the driver runs that once per batch).",
  "This is a headless run: ending your turn ends the run. Never end the turn after the implementation subagent reports back; continue through step 4 review and stop only at the HALT protocol with a final status written to the spec.",
  "Never change user-facing translations (ar, en, fr message text or .po msgstrs) just to make a test pass; fix the test, or HALT if real text is wrong. New or changed text needs native review, so record it in deferred-work.md.",
]

on_complete = """
Keep sprint status in step with the spec (the auto-dev driver does the same; this covers runs started directly). Do this only when the final status is `done` and the spec file is named `spec-<E>-<S>-*.md` for a sprint story (for example `spec-8-12-...` is epic 8, story 12):
1. In `{project-root}/_bmad-output/implementation-artifacts/sprint-status.yaml`, find the one `development_status` key that starts with `<E>-<S>-`. If none exists, or its value is already `done`, stop here.
2. Set that key's value to `done`. Then set `epic-<E>` to `done` if every `<E>-<n>-...` story key is now `done`, otherwise to `in-progress` if it is `backlog`. Change only those values on their own lines; keep every other line, comment and quoting byte for byte.
3. Commit only that file: `git add -- <that file>` and `git commit -m "chore(sprint): mark story <E>.<S> done"`. Never push.
"""

implementation_handoff = """
Launch a Claude subagent (Agent subagent_type `general-purpose`, model `sonnet`) with no prior conversation context. It may edit files. Do not use codex for this step. Use this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start. Do not invoke any skill or workflow; implement directly.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""

# Epic 8 retro F19: a response field added in one story (8.9's preview `revision`) broke a strict
# web parser another story owned (`parseChoice`), and every per-story review passed it.
[[workflow.review_layers]]
id = "cross-story-contract"
name = "Cross-Story Contract Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

You review the contract between the server and its consumers. The change under review is the unified diff at `{diff_file}`; read it, then read the repository as it is after the change (the working tree).

1. List every change in the diff to a shape that crosses a boundary: a JSON response or request body built by a Django/DRF view or helper (`api/`, `calc/views.py`, `reports/`, `mawareeth/`), a contract parser or dumper (`engine/contracts/`, `presentation/`, `web/src/contracts/`), or a status/variant value such a body can take. Count added, removed or renamed fields, type or nullability changes, and new status values. If there is none, reply "No contract shape changed" and stop.
2. For each changed shape, find every consumer on the other side in the whole repository, not only in the diff: strict TypeScript parsers (`hasExactKeys`, `exact(`, `parse*` functions under `web/src/api`, `web/src/contracts`, `web/src/interview`), Python contract parsers, shared fixtures (`api/contracts/*.json`, `contracts/fixtures/`), and harnesses that read these bodies (`api/capacity.py`, `mawareeth/release_gates.py`).
3. For each consumer and for every status or variant the body can have (for example a preview's `available`, `unavailable`, `choose_school`, `not_ready`), decide whether the consumer accepts the changed shape, and whether a test or fixture sends exactly that envelope through it. Cite file:line for both.

Report one finding per consumer that would reject, drop or misread the changed shape for any variant, and one per variant whose full envelope no test exercises. Give a concrete failure scenario for each: which response, which consumer, and what the user would see. Do not report style.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
"""
