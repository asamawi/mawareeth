# Mawareeth alert rules for SCDF's Prometheus on p1. Copy this file next to
# p1's other rule files and list it under rule_files (deploy/README.md,
# "Monitoring and alerting"). Every rule carries project=mawareeth, which the
# Alertmanager child route in alertmanager-route.yml matches, and a runbook
# annotation pointing at the matching README runbook. Staleness is judged here
# with time() - metric, so the host-side collector never compares clocks. The
# drill rules carry the operator alert-path drill (deploy/README.md,
# "Alert-path drill"). The host-health rules (inodes, read-only filesystems,
# memory, OOM kills, failed systemd units, clock sync) read node_exporter's
# built-in collectors; the failed-unit rule needs the systemd collector that
# monitor.sh install enables. MawareethWatchdog always fires: Alertmanager
# sends it to the Better Stack heartbeat (dead-man's switch for p1's
# Prometheus and Alertmanager), never to email.
groups:
  - name: mawareeth
    rules:
      - alert: MawareethHostDown
        expr: up{job="mawareeth-node"} == 0 or absent(up{job="mawareeth-node"})
        for: 2m
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth host {{ $labels.alias }} is not answering scrapes over Tailscale'
          description: 'Prometheus on p1 has not scraped {{ $labels.instance }} for 2 minutes, or the mawareeth-node job is missing. Other Mawareeth alerts except the Watchdog are inhibited while this fires.'
          runbook: 'deploy/README.md#runbook-mawareethhostdown'

      - alert: MawareethBackupUnhealthy
        expr: |
          mawareeth_backup_last_result_ok{job="mawareeth-node"} == 0
            or (time() - mawareeth_backup_last_ok_timestamp_seconds{job="mawareeth-node"}) > 26 * 3600
            or (mawareeth_backup_last_ok_timestamp_seconds{job="mawareeth-node"} - time()) > 300
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth backup is failed, missing, unreadable, older than 26 hours, or future-dated'
          description: 'The last-backup record is not ok, is unusable, its last successful finish is older than 26 hours, or it is more than 5 minutes in the future (clock skew), which also closes backup.sh gate.'
          runbook: 'deploy/README.md#runbook-mawareethbackupunhealthy'

      - alert: MawareethBackupIncomplete
        expr: |
          (mawareeth_backup_last_archives_complete{job="mawareeth-node"} == 0
              and mawareeth_backup_last_result_ok{job="mawareeth-node"} == 1)
            or (absent(mawareeth_backup_last_archives_complete{job="mawareeth-node"})
              and on() mawareeth_backup_last_result_ok{job="mawareeth-node"} == 1)
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth last successful backup lacks its host-state or globals archive'
          description: 'The last-backup record is ok but does not name both a host-state.tar and a globals.sql snapshot (or the archives metric is missing from mawareeth.prom), so a host rebuild or role recovery from it would be incomplete. A failed or unusable record is covered by MawareethBackupUnhealthy instead.'
          runbook: 'deploy/README.md#runbook-mawareethbackupincomplete'

      - alert: MawareethRestoreUnhealthy
        expr: |
          mawareeth_restore_last_result_pass{job="mawareeth-node"} == 0
            or (time() - mawareeth_restore_last_pass_timestamp_seconds{job="mawareeth-node"}) > 35 * 86400
            or (mawareeth_restore_last_pass_timestamp_seconds{job="mawareeth-node"} - time()) > 300
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth restore verification failed, is missing or unreadable, is older than 35 days, or is future-dated'
          description: 'The restore-verified record is not pass, is unusable, its last pass is older than 35 days, or it is more than 5 minutes in the future (clock skew); the write gate is closed.'
          runbook: 'deploy/README.md#runbook-mawareethrestoreunhealthy'

      - alert: MawareethDiskWarning
        expr: |
          100 * (1 - node_filesystem_avail_bytes{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"}
            / node_filesystem_size_bytes{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"}) > 75
        for: 5m
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth disk {{ $labels.mountpoint }} is {{ $value | printf "%.0f" }}% used (warning above 75%)'
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.alias }} has been more than 75% used for 5 minutes.'
          runbook: 'deploy/README.md#runbook-mawareethdisk'

      - alert: MawareethDiskCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"}
            / node_filesystem_size_bytes{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"}) > 85
        for: 5m
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth disk {{ $labels.mountpoint }} is {{ $value | printf "%.0f" }}% used (critical above 85%)'
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.alias }} has been more than 85% used for 5 minutes.'
          runbook: 'deploy/README.md#runbook-mawareethdisk'

      - alert: MawareethCollectorStale
        expr: |
          (time() - mawareeth_monitor_collect_timestamp_seconds{job="mawareeth-node"}) > 20 * 60
            or absent(mawareeth_monitor_collect_timestamp_seconds{job="mawareeth-node"})
            or node_textfile_scrape_error{job="mawareeth-node"} == 1
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth monitoring collector is stale, absent, or unreadable'
          description: 'mawareeth.prom is older than 20 minutes, absent, or could not be parsed by the textfile collector, so the backup and restore metrics cannot be trusted.'
          runbook: 'deploy/README.md#runbook-mawareethcollectorstale'

      - alert: MawareethAlertDrill
        expr: mawareeth_drill_active_code{job="mawareeth-node"} > 0
        labels:
          severity: info
          project: mawareeth
        annotations:
          summary: 'Mawareeth alert-path drill code {{ $value | printf "%.0f" }}'
          description: 'An operator ran monitor.sh drill start on {{ $labels.alias }}. Send the Better Stack test notification, then confirm with: sudo deploy/monitor.sh drill confirm <code> --better-stack-received. This repeats every 4 hours until the drill is confirmed or aborted.'
          runbook: 'deploy/README.md#runbook-mawareethalertdrill'

      - alert: MawareethDrillOverdue
        expr: |
          (time() - mawareeth_drill_last_pass_timestamp_seconds{job="mawareeth-node"}) > 92 * 86400
            or (mawareeth_drill_last_pass_timestamp_seconds{job="mawareeth-node"} - time()) > 300
            or absent(mawareeth_drill_last_pass_timestamp_seconds{job="mawareeth-node"})
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth alert-path drill is overdue, has never passed, or is future-dated'
          description: 'The last passed alert-path drill is older than 92 days, none has passed (or the drill record is unusable), the metric is missing from mawareeth.prom, or it is more than 5 minutes in the future (clock skew). Run the quarterly drill.'
          runbook: 'deploy/README.md#runbook-mawareethdrilloverdue'

      - alert: MawareethInodesLow
        expr: |
          100 * (1 - node_filesystem_files_free{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"}
            / (node_filesystem_files{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"} > 0)) > 85
        for: 5m
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth filesystem {{ $labels.mountpoint }} has {{ $value | printf "%.0f" }}% of its inodes used (critical above 85%)'
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.alias }} has had more than 85% of its inodes in use for 5 minutes; file creation fails once they run out, even with free bytes. Filesystems without a fixed inode count (btrfs reports 0) never fire.'
          runbook: 'deploy/README.md#runbook-mawareethinodeslow'

      - alert: MawareethFilesystemReadOnly
        expr: node_filesystem_readonly{job="mawareeth-node",fstype=~"ext4|xfs|btrfs"} == 1
        for: 2m
        labels:
          severity: critical
          project: mawareeth
        annotations:
          summary: 'Mawareeth filesystem {{ $labels.mountpoint }} is mounted read-only'
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.alias }} has been read-only for 2 minutes, usually after the kernel remounted it on an I/O or filesystem error. Writes, backups, and deploys fail.'
          runbook: 'deploy/README.md#runbook-mawareethfilesystemreadonly'

      - alert: MawareethMemoryPressure
        expr: |
          node_memory_MemAvailable_bytes{job="mawareeth-node"} / node_memory_MemTotal_bytes{job="mawareeth-node"} < 0.10
            or (1 - node_memory_SwapFree_bytes{job="mawareeth-node"}
              / (node_memory_SwapTotal_bytes{job="mawareeth-node"} > 0)) > 0.5
        for: 10m
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth host {{ $labels.alias }} is short of memory'
          description: 'For 10 minutes MemAvailable has been below 10% of MemTotal, or more than half of the swap space has been in use (a host without swap only checks MemAvailable).'
          runbook: 'deploy/README.md#runbook-mawareethmemorypressure'

      - alert: MawareethOOMKill
        expr: increase(node_vmstat_oom_kill{job="mawareeth-node"}[10m]) > 0
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth host {{ $labels.alias }} OOM-killed a process'
          description: 'The kernel OOM killer ran on {{ $labels.alias }} within the last 10 minutes. This resolves after 10 minutes without another kill.'
          runbook: 'deploy/README.md#runbook-mawareethoomkill'

      - alert: MawareethSystemdUnitFailed
        expr: |
          node_systemd_unit_state{job="mawareeth-node",state="failed"} == 1
            or absent(node_systemd_unit_state{job="mawareeth-node"})
        for: 5m
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth: {{ if $labels.name }}unit {{ $labels.name }} failed on {{ $labels.alias }}{{ else }}no node_systemd_unit_state series (systemd collector off; re-run monitor.sh install){{ end }}'
          description: 'A systemd unit has been in the failed state for 5 minutes, or no node_systemd_unit_state series has been scraped for 5 minutes (the exporter runs without --collector.systemd; re-run monitor.sh install).'
          runbook: 'deploy/README.md#runbook-mawareethsystemdunitfailed'

      - alert: MawareethClockUnsynced
        expr: |
          node_timex_sync_status{job="mawareeth-node"} == 0
            or abs(node_timex_offset_seconds{job="mawareeth-node"}) > 0.5
        for: 10m
        labels:
          severity: warning
          project: mawareeth
        annotations:
          summary: 'Mawareeth host {{ $labels.alias }} clock is not synchronised'
          description: 'For 10 minutes the kernel has reported the clock as unsynchronised, or its offset has exceeded 0.5 seconds. A drifting clock also skews the backup, restore, and drill age rules.'
          runbook: 'deploy/README.md#runbook-mawareethclockunsynced'

      - alert: MawareethWatchdog
        expr: vector(1)
        labels:
          severity: heartbeat
          project: mawareeth
        annotations:
          summary: 'Mawareeth alert-path heartbeat (always firing)'
          description: 'This alert always fires. Alertmanager on p1 sends it to the Better Stack heartbeat about every 1-2 minutes; Better Stack alerts when the pings stop, which means p1 Prometheus, Alertmanager, or their outbound path stopped. It is never emailed and never inhibited.'
          runbook: 'deploy/README.md#runbook-mawareethwatchdog'
