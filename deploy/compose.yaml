name: mawareeth

x-app: &app
  image: ${APP_IMAGE:?use deploy/runtime.sh as the supported entrypoint}
  pull_policy: never
  env_file:
    - path: ${APP_SNAPSHOT:?use deploy/runtime.sh as the supported entrypoint}
      format: raw
      required: true
  expose:
    - "8000"
  networks:
    - app
    - database
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  logging: &bounded-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?use deploy/runtime.sh as the supported entrypoint}
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?use deploy/runtime.sh as the supported entrypoint}
      POSTGRES_USER: ${POSTGRES_USER:?use deploy/runtime.sh as the supported entrypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?use deploy/runtime.sh as the supported entrypoint}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *bounded-logs

  app-blue:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy

  app-green:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: ${CADDY_IMAGE:?use deploy/runtime.sh as the supported entrypoint}
    pull_policy: never
    environment:
      DOMAIN: ${DOMAIN:?use deploy/runtime.sh as the supported entrypoint}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/routes:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    restart: unless-stopped
    depends_on:
      app-blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/caddy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *bounded-logs

networks:
  app:
  database:
    internal: true

volumes:
  postgres-data:
    external: true
    name: mawareeth-postgres-data
  caddy-data:
    external: true
    name: mawareeth-caddy-data
  caddy-config:
    external: true
    name: mawareeth-caddy-config
