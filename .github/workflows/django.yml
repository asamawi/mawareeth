name: Django CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d mydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: production
      DJANGO_KEY: ci-build-validation-key-with-sufficient-length-0123456789
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1,ci.example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://localhost,https://127.0.0.1,https://ci.example.com
      DATABASE_SSL_MODE: disable
      RELEASE_VERSION: ci
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      MAILGUN_ACCESS_KEY: dummy
      MAILGUN_SERVER_NAME: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.28"

      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify committed migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py migrate --noinput

      - name: Build static assets
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py collectstatic --noinput

      - name: Run deploy checks
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py test
