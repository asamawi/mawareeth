name: Django CI

# Feature branches are validated through their pull request; master is also
# validated on push because that run gates Publish Release Image.
on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels its superseded run. Master runs are never
# cancelled, since each merge commit needs its own release-gating run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d mydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: production
      DJANGO_KEY: ci-build-validation-key-with-sufficient-length-0123456789
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1,ci.example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://localhost,https://127.0.0.1,https://ci.example.com
      DATABASE_SSL_MODE: disable
      RELEASE_VERSION: ci
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      MAILGUN_ACCESS_KEY: dummy
      MAILGUN_SERVER_NAME: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.28"

      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify committed migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py migrate --noinput

      - name: Build static assets
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py collectstatic --noinput

      - name: Run deploy checks
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mydb_test
        run: python manage.py test

  deploy-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
      PROMETHEUS_VERSION: "3.15.0"
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      ALERTMANAGER_VERSION: "0.34.1"
      ALERTMANAGER_SHA256: 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned ShellCheck, promtool and amtool
        run: |
          dl="$RUNNER_TEMP/tools-dl"; bin="$RUNNER_TEMP/tools-bin"
          mkdir -p "$dl" "$bin"
          cd "$dl"
          sc="shellcheck-v${SHELLCHECK_VERSION}"
          prom="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          am="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64"
          fetch() { curl -fsSL --retry 3 --retry-connrefused -o "$1" "$2"; }
          fetch "$sc.tar.gz" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$sc.linux.x86_64.tar.gz"
          fetch "$prom.tar.gz" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$prom.tar.gz"
          fetch "$am.tar.gz" "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/$am.tar.gz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$sc.tar.gz" "$PROMETHEUS_SHA256" "$prom.tar.gz" \
            "$ALERTMANAGER_SHA256" "$am.tar.gz" | sha256sum -c -
          tar -xzf "$sc.tar.gz" "$sc/shellcheck"
          tar -xzf "$prom.tar.gz" "$prom/promtool"
          tar -xzf "$am.tar.gz" "$am/amtool"
          install -m 0755 "$sc/shellcheck" "$prom/promtool" "$am/amtool" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verify tools
        run: |
          "$RUNNER_TEMP/tools-bin/shellcheck" --version
          promtool --version
          amtool --version

      - name: ShellCheck deploy scripts
        run: '"$RUNNER_TEMP/tools-bin/shellcheck" deploy/*.sh deploy/tests/*.sh'

      - name: Run deploy suites unprivileged
        run: |
          for suite in deploy/tests/test_*.sh; do
            echo "::group::$suite (unprivileged)"
            bash "$suite" || { echo "::endgroup::"; echo "::error::$suite failed (unprivileged)"; exit 1; }
            echo "::endgroup::"
          done

      - name: Run deploy suites as root
        # promtool/amtool results do not depend on privileges and already ran
        # in the unprivileged pass; they are the slowest part of the suites.
        env:
          MAWAREETH_SKIP_RULE_TOOLS: "1"
        run: |
          for suite in deploy/tests/test_*.sh; do
            echo "::group::$suite (root)"
            sudo --preserve-env=CI,MAWAREETH_SKIP_RULE_TOOLS env "PATH=$PATH" bash "$suite" || { echo "::endgroup::"; echo "::error::$suite failed (root)"; exit 1; }
            echo "::endgroup::"
          done

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # Builds the full release image (default runtime target), so the builder
      # stage's collectstatic and check --deploy gates run before merge. Nothing
      # is pushed, loaded, or tagged; Publish Release Image stays the only producer.
      - name: Build release image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          build-args: |
            RELEASE_VERSION=ci
            RELEASE_COMMIT_SHA=${{ github.sha }}

  caddy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve pinned Caddy image from deploy/runtime-images.lock
        id: caddy
        run: |
          set -euo pipefail
          lock=deploy/runtime-images.lock
          if [ ! -f "$lock" ]; then
            echo "::error file=$lock::$lock is missing"
            exit 1
          fi
          mapfile -t matches < <(tr -d '\r' < "$lock" | grep -E '^CADDY_IMAGE=' || true)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error file=$lock::$lock must contain exactly one CADDY_IMAGE line (found ${#matches[@]})"
            exit 1
          fi
          image="${matches[0]#CADDY_IMAGE=}"
          if ! [[ "$image" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=$lock::CADDY_IMAGE in $lock is not a digest-pinned reference (<image>@sha256:<64 hex>)"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Caddy image: $image"

      - name: Pull pinned Caddy image
        env:
          CADDY_IMAGE: ${{ steps.caddy.outputs.image }}
        run: |
          for attempt in 1 2 3; do
            docker pull "$CADDY_IMAGE" && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::could not pull $CADDY_IMAGE"
          exit 1

      - name: Validate Caddyfile with blue and green routes
        env:
          CADDY_IMAGE: ${{ steps.caddy.outputs.image }}
        run: |
          set -euo pipefail
          seed=deploy/caddy/active-slot.caddy
          for slot in blue green; do
            routes="$RUNNER_TEMP/routes-$slot"
            rm -rf "$routes" && mkdir -p "$routes"
            # The seed is the canonical blue route; green differs only by slot name.
            sed "s/blue/$slot/g" "$seed" > "$routes/active-slot.caddy"
            if ! grep -q "app-$slot:8000" "$routes/active-slot.caddy" \
              || ! grep -q "header_down X-Mawareeth-Slot $slot" "$routes/active-slot.caddy" \
              || { [ "$slot" != blue ] && grep -q blue "$routes/active-slot.caddy"; }; then
              echo "::error file=$seed::could not render the $slot route from $seed"
              exit 1
            fi
            echo "::group::caddy adapt --validate ($slot route)"
            # Same mount paths as deploy/compose.yaml; adapt --validate also
            # provisions modules, and its JSON proves the route was imported
            # (a glob that matches nothing is not an error).
            if ! docker run --rm --network none -e DOMAIN=ci.example.com \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$PWD/deploy/caddy/edge:/etc/caddy/edge:ro" \
              -v "$routes:/etc/caddy/routes:ro" \
              "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate > "$RUNNER_TEMP/adapted-$slot.json"; then
              echo "::endgroup::"
              echo "::error file=deploy/Caddyfile::Caddy rejected deploy/Caddyfile with the $slot route"
              exit 1
            fi
            echo "::endgroup::"
            if ! grep -q "\"dial\":\"app-$slot:8000\"" "$RUNNER_TEMP/adapted-$slot.json"; then
              echo "::error file=deploy/Caddyfile::the adapted config has no app-$slot:8000 upstream; the route import matched nothing"
              exit 1
            fi
          done

      - name: Validate Caddyfile in the cloudflare edge mode
        env:
          CADDY_IMAGE: ${{ steps.caddy.outputs.image }}
        run: |
          set -euo pipefail
          routes="$RUNNER_TEMP/routes-cloudflare"
          origin="$RUNNER_TEMP/origin-tls"
          rm -rf "$routes" "$origin" && mkdir -p "$routes" "$origin"
          cp deploy/caddy/active-slot.caddy "$routes/"
          # A throwaway self-signed certificate stands in for the Cloudflare
          # Origin certificate; adapt --validate loads it.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj /CN=ci.example.com -addext 'subjectAltName=DNS:ci.example.com,DNS:*.ci.example.com' \
            -keyout "$origin/key.pem" -out "$origin/cert.pem" 2>/dev/null
          chmod 0644 "$origin/key.pem" "$origin/cert.pem"
          echo "::group::caddy adapt --validate (cloudflare edge mode)"
          if ! docker run --rm --network none -e DOMAIN=www.ci.example.com -e EDGE_MODE=cloudflare -e REDIRECT_DOMAIN=ci.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/caddy/edge:/etc/caddy/edge:ro" \
            -v "$routes:/etc/caddy/routes:ro" \
            -v "$origin:/etc/caddy/origin-tls:ro" \
            "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate > "$RUNNER_TEMP/adapted-cloudflare.json"; then
            echo "::endgroup::"
            echo "::error file=deploy/Caddyfile::Caddy rejected deploy/Caddyfile in the cloudflare edge mode"
            exit 1
          fi
          echo "::endgroup::"
          # The redirect, the Cloudflare trust, the www route to the slot, the
          # Origin certificate selected for both names, and no ACME certificate
          # for either name. Shape changes surface as named errors.
          python3 - "$RUNNER_TEMP/adapted-cloudflare.json" <<'PY'
          import json
          import sys

          apex, www = "ci.example.com", "www.ci.example.com"
          problems = []


          def as_dict(value):
              return value if isinstance(value, dict) else {}


          def as_list(value):
              return value if isinstance(value, list) else []


          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for item in value.values():
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)


          def hosts(route):
              return {host for match in as_list(as_dict(route).get("match")) for host in as_list(as_dict(match).get("host"))}


          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  config = as_dict(json.load(handle))
          except (OSError, ValueError) as error:
              config = {}
              problems.append("the adapted config is not readable JSON: " + type(error).__name__)

          apps = as_dict(config.get("apps"))
          servers = as_dict(as_dict(apps.get("http")).get("servers"))
          edge = [as_dict(server) for server in servers.values() if any({apex, www} & hosts(route) for route in as_list(as_dict(server).get("routes")))]
          if not edge:
              problems.append("no server serves the edge names")
          for server in edge:
              trusted = as_dict(server.get("trusted_proxies"))
              ranges = as_list(trusted.get("ranges"))
              if trusted.get("source") != "static" or "173.245.48.0/20" not in ranges or "2400:cb00::/32" not in ranges:
                  problems.append("trusted_proxies is not the static Cloudflare ranges")
              if as_dict(server.get("automatic_https")).get("disable_certificates") is not True:
                  problems.append("certificate automation is not disabled")

          routes = [as_dict(route) for server in edge for route in as_list(server.get("routes"))]
          redirects = [handler for route in routes if apex in hosts(route) for handler in walk(route) if handler.get("handler") == "static_response"]
          if not any(
              str(handler.get("status_code")) == "301"
              and as_dict(handler.get("headers")).get("Location") == ["https://" + www + "{http.request.uri}"]
              for handler in redirects
          ):
              problems.append(apex + " does not permanently redirect to https://" + www + " with the path and query")
          # The canonical name reaches the slot through the imported route.
          if not any(
              handler.get("handler") == "reverse_proxy"
              and any(as_dict(upstream).get("dial") == "app-blue:8000" for upstream in as_list(handler.get("upstreams")))
              for route in routes
              if www in hosts(route)
              for handler in walk(route)
          ):
              problems.append(www + " does not reach a reverse_proxy to app-blue:8000")

          tls = as_dict(apps.get("tls"))
          loaded = [as_dict(entry) for entry in as_list(as_dict(tls.get("certificates")).get("load_files"))]
          origin = [entry for entry in loaded if entry.get("certificate") == "/etc/caddy/origin-tls/cert.pem"]
          if len(origin) != 1 or origin[0].get("key") != "/etc/caddy/origin-tls/key.pem":
              problems.append("the Origin certificate and key are not loaded")
          # Both names select the loaded certificate by its tag.
          tags = set(as_list(origin[0].get("tags"))) if origin else set()
          selected = set()
          for server in edge:
              for policy in as_list(server.get("tls_connection_policies")):
                  policy = as_dict(policy)
                  any_tag = set(as_list(as_dict(policy.get("certificate_selection")).get("any_tag")))
                  if tags and tags & any_tag:
                      selected |= {apex, www} & set(as_list(as_dict(policy.get("match")).get("sni")))
          if selected != {apex, www}:
              problems.append("the Origin certificate is not selected for both names (selected: " + ", ".join(sorted(selected)) + ")")

          for policy in as_list(as_dict(tls.get("automation")).get("policies")):
              policy = as_dict(policy)
              if {apex, www} & set(as_list(policy.get("subjects"))):
                  problems.append("an automation policy covers an edge name")
              for issuer in as_list(policy.get("issuers")):
                  if as_dict(issuer).get("module") in ("acme", "zerossl"):
                      problems.append("an ACME issuer is configured")
          for problem in problems:
              print("::error file=deploy/caddy/edge/cloudflare::" + problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Self-test that validation rejects a broken Caddyfile
        env:
          CADDY_IMAGE: ${{ steps.caddy.outputs.image }}
        run: |
          set -euo pipefail
          routes="$RUNNER_TEMP/routes-selftest"
          rm -rf "$routes" && mkdir -p "$routes"
          cp deploy/caddy/active-slot.caddy "$routes/"
          broken="$RUNNER_TEMP/Caddyfile.broken"
          sed 's|^\(\s*\)import /etc/caddy/routes/\*\.caddy$|\1mawareeth_not_a_directive\n&|' deploy/Caddyfile > "$broken"
          if ! grep -q 'mawareeth_not_a_directive' "$broken"; then
            echo "::error::could not build the broken Caddyfile copy for the self-test"
            exit 1
          fi
          echo "::group::caddy adapt --validate (broken copy, must fail)"
          if docker run --rm --network none -e DOMAIN=ci.example.com \
            -v "$broken:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/caddy/edge:/etc/caddy/edge:ro" \
            -v "$routes:/etc/caddy/routes:ro" \
            "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate > "$RUNNER_TEMP/broken.log" 2>&1; then
            cat "$RUNNER_TEMP/broken.log"
            echo "::endgroup::"
            echo "::error::the Caddy check accepts invalid config: a Caddyfile with an unknown directive validated"
            exit 1
          fi
          cat "$RUNNER_TEMP/broken.log"
          echo "::endgroup::"
          # A rejection for any other reason (mounts, image) would prove nothing.
          if ! grep -q 'mawareeth_not_a_directive' "$RUNNER_TEMP/broken.log"; then
            echo "::error::the broken Caddyfile was rejected, but not for the injected directive"
            exit 1
          fi
          echo "Broken Caddyfile was rejected as expected."
