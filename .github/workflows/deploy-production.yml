name: Deploy Production
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Deploy {0}', inputs.sha)
  || format('Deploy after Publish Release Image run {0}', github.event.workflow_run.id) }}

# Production deploy. It starts on its own when a master "Publish Release Image"
# run succeeds, and can also be dispatched by hand with a SHA (for a rollback or
# a retry). The runner joins the tailnet as an ephemeral tag:ci-deploy node and
# sends the host one thing: the commit SHA. The host's forced command and root
# wrapper (deploy/ci-deploy.sh) fetch, validate and deploy that commit's
# published release manifest themselves. See "Deploying from GitHub Actions"
# in deploy/README.md.
on:
  workflow_run:
    workflows: ["Publish Release Image"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character lowercase commit SHA on master whose Publish Release Image run succeeded
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time, never cancelled. GitHub keeps at most one pending run
# per group: a newer run replaces a pending (queued) one, which is then
# cancelled, so the newest release wins when merges arrive close together.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve-sha:
    # workflow_run and workflow_dispatch both run the default branch's copy of
    # this file, so github.ref is master for every legitimate run.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # A workflow_run event reports the default branch head at trigger time,
      # which can already be a later merge, so an automatic run takes the SHA
      # from the Publish run's own release-manifest-<SHA> artifact instead.
      - name: Resolve and validate the commit SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha="$INPUT_SHA"
          else
            sha="$(gh api "repos/$GH_REPO/actions/runs/$PUBLISH_RUN_ID/artifacts" \
              --jq '.artifacts[].name | capture("^release-manifest-(?<sha>[0-9a-f]{40})$") | .sha')"
            if [ "$(printf '%s' "$sha" | grep -c .)" -ne 1 ]; then
              echo "::error::Publish Release Image run $PUBLISH_RUN_ID has no single release-manifest-<SHA> artifact"
              exit 1
            fi
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve-sha
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    # The environment holds the deploy secrets and variables and limits
    # deployments to master. It has no required reviewers: a successful
    # master publish deploys without a manual step.
    environment: production
    steps:
      - name: Revalidate commit SHA and host inputs
        env:
          SHA: ${{ needs.resolve-sha.outputs.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the sha input must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          if ! [[ "$DEPLOY_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
            echo "::error::the DEPLOY_HOST environment variable must be the host's tailnet name"
            exit 1
          fi

      - name: Join the tailnet as an ephemeral tag:ci-deploy node
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          version: "1.94.2"
          use-cache: "false"
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy the release on the host
        env:
          SHA: ${{ needs.resolve-sha.outputs.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/deploy-ssh"
          trap 'rm -rf -- "$dir"' EXIT
          mkdir -p "$dir"
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::the DEPLOY_SSH_KEY environment secret is empty"
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$dir/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$dir/known_hosts"
          if ! grep -q . "$dir/known_hosts"; then
            echo "::error::the DEPLOY_KNOWN_HOSTS environment variable is empty"
            exit 1
          fi
          # The host key is pinned; the forced command ignores everything but
          # the SHA, which is the only payload. Its exit code is the job's.
          status=0
          ssh -T -a -x -F none -i "$dir/id" \
            -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ClearAllForwardings=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "mawareeth-deploy@$DEPLOY_HOST" "$SHA" 2>&1 | tee "$dir/output" || status=$?
          result="$(sed -n 's/^ci-deploy: result=//p' "$dir/output" | tail -n 1)"
          {
            echo "### Production deploy"
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Exit code: \`$status\`"
            echo "- Wrapper result: \`${result:-none reported}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
