name: Cloudflare IP Drift

# Weekly, read-only comparison of deploy/cloudflare-ips.txt with the ranges
# Cloudflare publishes. A failed run is the signal; nothing is opened or pushed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compare with the published ranges
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          out="$(bash deploy/cloudflare-ips-check.sh)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 1 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] || echo "::error::Cloudflare IP drift, $line"
            done <<<"$out"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Cloudflare IP check could not complete (exit $rc)"
          fi
          exit "$rc"
